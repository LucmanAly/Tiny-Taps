name: Generate bundled Piper audio

on:
  workflow_dispatch:
    inputs:
      voice:
        description: Piper voice model
        required: false
        default: en_US-amy-medium
  push:
    paths:
      - '.github/workflows/generate-animal-audio.yml'
      - 'scripts/animals.json'
      - 'scripts/words.json'
      - 'scripts/generate-animal-audio.mjs'
      - 'scripts/generate-number-audio.mjs'
      - 'js/games/numberbook.js'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Piper and FFmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts==1.5.0
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Piper voice
        env:
          PIPER_VOICE: ${{ inputs.voice || 'en_US-amy-medium' }}
          PIPER_DATA_DIR: .cache/piper
        run: |
          mkdir -p "$PIPER_DATA_DIR"
          python -m piper.download_voices --data-dir "$PIPER_DATA_DIR" "$PIPER_VOICE"

      - name: Generate MP3 files
        env:
          PIPER_VOICE: ${{ inputs.voice || 'en_US-amy-medium' }}
          PIPER_DATA_DIR: .cache/piper
          REGENERATE_AUDIO: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          npm run generate:animal-audio
          npm run generate:number-audio

      - name: Commit generated audio
        run: |
          if [ -z "$(git status --porcelain -- assets/audio/animals assets/audio/numbers)" ]; then
            echo "No audio files changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/animals assets/audio/numbers
          git commit -m "Generate bundled Piper voice audio"
          git push
