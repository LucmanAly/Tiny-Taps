name: Generate animal audio

on:
  workflow_dispatch:
    inputs:
      voice:
        description: Piper voice model
        required: false
        default: en_US-amy-medium

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Piper and FFmpeg
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts==1.5.0
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Piper voice
        env:
          PIPER_VOICE: ${{ inputs.voice }}
          PIPER_DATA_DIR: .cache/piper
        run: |
          mkdir -p "$PIPER_DATA_DIR"
          python -m piper.download_voices --data-dir "$PIPER_DATA_DIR" "$PIPER_VOICE"

      - name: Generate MP3 files
        env:
          PIPER_VOICE: ${{ inputs.voice }}
          PIPER_DATA_DIR: .cache/piper
        run: npm run generate:animal-audio

      - name: Commit generated audio
        run: |
          if [ -z "$(git status --porcelain -- assets/audio/animals)" ]; then
            echo "No new audio files were generated."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/animals
          git commit -m "Generate animal name audio with Piper"
          git push
